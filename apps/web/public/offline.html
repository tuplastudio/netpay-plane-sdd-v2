<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — Easy Sell</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0a09;
        color: #ffffff;
      }
      .badge {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0b0a09;
        font-weight: 600;
        font-size: 1.25rem;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 0.9375rem;
        opacity: 0.75;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 9999px;
        border: none;
        background: #ffffff;
        color: #0b0a09;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="badge" aria-hidden="true">ES</div>
    <h1>Sin conexión</h1>
    <p>No se pudo cargar esta página. Revisa tu conexión a internet e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
