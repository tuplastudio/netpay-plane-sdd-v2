services:
  postgres:
    image: postgres:16-alpine
    container_name: netpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netpay
      POSTGRES_USER: netpay_app
      POSTGRES_PASSWORD: netpay_app
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpay_app -d netpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_dummy:
    image: postgres:16-alpine
    container_name: netpay_postgres_dummy
    restart: unless-stopped
    environment:
      POSTGRES_DB: netpay_dummy
      POSTGRES_USER: netpay_dummy
      POSTGRES_PASSWORD: netpay_dummy
    ports:
      - "15433:5432"
    volumes:
      - postgres_dummy_data:/var/lib/postgresql/data
      - ./initdb-dummy:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpay_dummy -d netpay_dummy"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: netpay_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: netpay
      RABBITMQ_DEFAULT_PASS: netpay
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: netpay_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: netpay_minio
      MINIO_ROOT_PASSWORD: netpay_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Apps (perfil "full": docker compose --profile full up) ----
  # Uso normal de desarrollo sigue siendo `pnpm dev` sobre esta infra;
  # este perfil es para levantar el stack completo en contenedores.
  dummy-gateway:
    build:
      context: ..
      dockerfile: apps/dummy-gateway/Dockerfile
    container_name: netpay_dummy_gateway
    profiles: ["full"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DUMMY_PORT: "4100"
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  commerce-api:
    build:
      context: ..
      dockerfile: apps/commerce-api/Dockerfile
    container_name: netpay_commerce_api
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dummy-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Producción (Droplet): Neon gestionado. Sobre-escribe el default del
      # .env del host (que apunta a localhost) para que el contenedor salga
      # directamente al pooler de Neon sin pasar por un Postgres local.
      DATABASE_URL: ${DATABASE_URL:-postgresql://netpay_app:netpay_app@postgres:5432/netpay?schema=public}
      # Servidor-a-servidor (red interna de Docker): commerce-api -> dummy-gateway.
      DUMMY_BASE_URL: http://dummy-gateway:4100
      # Navegador -> dummy-gateway (link de pago que se abre en el cliente).
      DUMMY_PUBLIC_URL: http://localhost:4100
      # dummy-gateway -> commerce-api (callback del webhook de pago).
      API_SELF_URL: http://commerce-api:4000
      # Navegador -> web (CORS y enlaces públicos de cotización).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      # commerce-api -> agente (WhatsAppBridge para responder inbound).
      # Apunta al v2 (LangGraph). Para volver al v1 basta con cambiar esta
      # línea a http://agent-service:8000: el contrato HTTP es el mismo.
      AGENT_URL: ${AGENT_URL:-http://agent-v2:8010}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      PAYMENT_PROVIDER: DUMMY
      SESSION_SECRET_REF: ${SESSION_SECRET_REF:-session_secret_change_me_64_chars_minimum_pad_pad_pad}
      TOKEN_ENCRYPTION_KEY_REF: ${TOKEN_ENCRYPTION_KEY_REF:-token_encryption_key_change_me_32_bytes}
      # Evolution API (Baileys). Sin esto, el flujo /channels → conectar Evolution
      # falla con "Evolution no está configurado" y el agente no recibe mensajes
      # de WhatsApp Baileys. Default vacío permite arrancar sin él; el .env
      # del droplet los define para activar el canal.
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY_REF: ${EVOLUTION_API_KEY_REF:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  commerce-worker:
    build:
      context: ..
      dockerfile: apps/commerce-worker/Dockerfile
    container_name: netpay_commerce_worker
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_PORT: "4101"
      DATABASE_URL: postgresql://netpay_app:netpay_app@postgres:5432/netpay?schema=public
      BROKER_URL: amqp://netpay:netpay@rabbitmq:5672
    ports:
      - "4101:4101"

  agent-service:
    build:
      context: ../apps/agent-service
      dockerfile: Dockerfile
    container_name: netpay_agent_service
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      commerce-api:
        condition: service_healthy
    environment:
      COMMERCE_API_URL: http://commerce-api:4000/api/v1
      AGENT_API_KEY_REF: ${AGENT_API_KEY_REF:-}
      OPENROUTER_KEY_REF: ${OPENROUTER_KEY_REF:-}
      AGENT_PORT: "8000"
      # Config del agente editable desde el panel + checkpoints: persisten
      # en volumen, no mueren al recrear el contenedor.
      # Navegador -> web: enlaces de cotización y pago que el agente manda al
      # cliente. Debe apuntar al puerto público del frontend, no al default.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      AGENT_SETTINGS_DIR: /data/settings
      AGENT_CHECKPOINT_DIR: /data/checkpoints
      AGENT_LEARNING_DIR: /data/learning
    volumes:
      - agent_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/healthz', timeout=3).status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Agente v2: LangGraph + deepagents. Mismo contrato HTTP que agent-service,
  # así que para cambiar de agente basta con apuntar AGENT_URL a este.
  agent-v2:
    build:
      context: ../apps/agent-v2
      dockerfile: Dockerfile
    container_name: netpay_agent_v2
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      commerce-api:
        condition: service_healthy
    environment:
      COMMERCE_API_URL: http://commerce-api:4000/api/v1
      AGENT_API_KEY_REF: ${AGENT_API_KEY_REF:-}
      OPENROUTER_KEY_REF: ${OPENROUTER_KEY_REF:-}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      MODEL_ID: ${AGENT_V2_MODEL_ID:-openai/gpt-4o-mini}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      AGENT_V2_DATA_DIR: /data/agent-v2
      # Sin esto el store escribía en /app/.settings (capa efímera del
      # contenedor): las settings por tenant —incluida la key de OpenRouter
      # cifrada— se perdían en cada recreate. Va al volumen persistente.
      AGENT_SETTINGS_DIR: /data/agent-v2/settings
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-}
    volumes:
      - agent_data:/data
    # Sin `ports`: agent-v2 solo confía en X-Internal-Key y no valida que el
    # tenantId recibido sea el del llamante, así que publicarlo en el host lo
    # deja a un salto de cualquier lectura/escritura cruzada entre empresas.
    # commerce-api y web lo alcanzan por la red de compose (http://agent-v2:8010).
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8010/healthz', timeout=3).status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://commerce-api:4000
    container_name: netpay_web
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      commerce-api:
        condition: service_healthy
      agent-v2:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Route handler server-side (apps/web/src/app/agent/[...path]/route.ts):
      # se lee en runtime, no en build, así que basta con env normal.
      # OJO: debe apuntar al MISMO agente que commerce-api (AGENT_URL). Si el
      # panel edita ajustes/conocimiento en un agente y WhatsApp contesta con
      # otro, las empresas ven configuración que el bot no usa.
      AGENT_INTERNAL_URL: ${AGENT_URL:-http://agent-v2:8010}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  postgres_dummy_data:
  rabbitmq_data:
  minio_data:
  agent_data:

networks:
  # El nombre de red debe ser estable y matchear lo que conectamos manualmente
  # (captain-nginx, etc.). Si docker compose lo autogenera como
  # "<dir>_default", los contenedores terminan en otra red y los nombres
  # de servicio dejan de resolver para los clientes externos.
  netpay_internal:
    name: infra_netpay_internal
    driver: bridge