name: One-off - diagnostico firewall/fail2ban (reset externo)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            echo "--- fail2ban ---"
            if command -v fail2ban-client >/dev/null 2>&1; then
              sudo fail2ban-client status 2>&1
              for j in $(sudo fail2ban-client status 2>&1 | grep 'Jail list' | sed 's/.*://;s/,//g'); do
                echo "-- jail $j --"
                sudo fail2ban-client status "$j" 2>&1
              done
            else
              echo "fail2ban no instalado"
            fi

            echo "--- iptables INPUT (resumen) ---"
            sudo iptables -L INPUT -n -v --line-numbers 2>&1 | head -60

            echo "--- iptables DOCKER-USER (caprover a veces mete reglas aqui) ---"
            sudo iptables -L DOCKER-USER -n -v --line-numbers 2>&1 | head -60

            echo "--- conexiones activas puerto 443 ---"
            sudo ss -tn state established '( dport = :443 or sport = :443 )' 2>&1 | head -30
            echo "total conexiones 443:"
            sudo ss -tn '( dport = :443 or sport = :443 )' 2>&1 | wc -l

            echo "--- doctl disponible? (cloud firewall de DO) ---"
            if command -v doctl >/dev/null 2>&1; then
              doctl compute firewall list 2>&1 | head -20
            else
              echo "doctl no instalado en el droplet"
            fi

            echo "--- caddy (netpay) activo? ---"
            sudo systemctl status caddy --no-pager 2>&1 | head -15 || echo "sin systemd caddy"
            sudo ss -tlnp 2>&1 | grep -E ':443|:80|:8443|:8080' || echo "sin listeners relevantes via ss"
