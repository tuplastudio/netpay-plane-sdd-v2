name: One-off - nginx error log y config TLS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            echo "--- nginx error.log (tail 100) ---"
            docker exec "$NGX" sh -c 'find /var/log/nginx -iname "error*" -exec tail -n 100 {} \;' 2>&1

            echo "--- ssl_protocols / ssl_ciphers efectivos ---"
            docker exec "$NGX" sh -c 'grep -rniE "ssl_protocol|ssl_ciphers|ssl_prefer" /etc/nginx/' 2>&1

            echo "--- test handshake TLS1.3 explicito desde el droplet ---"
            curl -skv --tlsv1.3 -o /dev/null https://api-easysell.tupla.dev/api/v1/healthz --max-time 10 2>&1 | grep -iE "SSL|TLS|HTTP|error|alert" | head -30

            echo "--- test con http2 explicito ---"
            curl -skv --http2 -o /dev/null https://api-easysell.tupla.dev/api/v1/healthz --max-time 10 2>&1 | grep -iE "SSL|TLS|HTTP|error|alert|ALPN" | head -30

            echo "--- openssl s_client directo (ver cert chain / alertas) ---"
            echo -e "GET / HTTP/1.1\r\nHost: captain.cx.tupla.dev\r\nConnection: close\r\n\r\n" | timeout 8 openssl s_client -connect 127.0.0.1:443 -servername captain.cx.tupla.dev 2>&1 | head -40
