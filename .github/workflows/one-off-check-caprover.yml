name: One-off - diagnostico CapRover / captain-nginx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            echo "--- docker ps (captain + commerce) ---"
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | grep -E 'captain|commerce-api' || echo "sin contenedores captain/commerce-api"

            echo "--- docker service ls (swarm) ---"
            docker service ls 2>&1 | grep -i captain || echo "sin servicios captain en swarm"

            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            echo "--- captain-nginx container: ${NGX:-NO ENCONTRADO} ---"
            if [ -n "$NGX" ]; then
              echo "--- nginx -t ---"
              docker exec "$NGX" nginx -t 2>&1
              echo "--- logs captain-nginx (tail 50) ---"
              docker logs "$NGX" --tail 50 2>&1
              echo "--- red infra_netpay_internal conectada? ---"
              docker network inspect infra_netpay_internal --format '{{range .Containers}}{{.Name}} {{end}}' 2>&1 | grep -q captain-nginx && echo "conectado" || echo "NO conectado"
            fi

            echo "--- vhosts manuales en disco ---"
            sudo ls -la /captain/generated/nginx/conf.d/ 2>&1 | grep -E 'api-easysell|imssbienestar' || echo "ningun vhost manual presente"

            echo "--- contenido vhost api-easysell ---"
            sudo cat /captain/generated/nginx/conf.d/api-easysell.conf 2>&1 | head -40

            echo "--- certificados letsencrypt ---"
            sudo ls -la /captain/data/letencrypt/etc/live/ 2>&1

            echo "--- curl local a commerce-api (dentro de la red docker) ---"
            cd /opt/netpay-build/infra 2>/dev/null && docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api node -e "fetch('http://localhost:4000/api/v1/healthz').then(r=>r.text().then(t=>console.log(r.status,t)))" 2>&1 || echo "fallo curl interno"

            echo "--- curl externo via dominio (desde el propio droplet) ---"
            curl -sk -o /dev/null -w 'HTTP %{http_code} (%{time_total}s)\n' https://api-easysell.tupla.dev/api/v1/healthz --max-time 10 2>&1 || echo "fallo curl externo"
            curl -sk -o /dev/null -w 'captain dashboard: HTTP %{http_code} (%{time_total}s)\n' https://captain.cx.tupla.dev --max-time 10 2>&1 || echo "fallo curl dashboard"

            echo "--- disco y memoria ---"
            df -h / 2>&1 | tail -1
            free -h 2>&1 | head -2
