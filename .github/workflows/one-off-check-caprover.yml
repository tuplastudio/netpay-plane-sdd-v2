name: One-off - buscar reglas deny/geo-block especificas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -uo pipefail
            echo "--- ufw status numbered COMPLETO ---"
            sudo ufw status numbered 2>&1

            echo "--- reglas ufw crudas (user.rules) ---"
            sudo grep -n "DROP\|REJECT\|DENY" /etc/ufw/user.rules 2>&1 | head -40
            sudo grep -n "DROP\|REJECT\|DENY" /etc/ufw/user6.rules 2>&1 | head -40

            echo "--- iptables -S completo (todas las cadenas) ---"
            sudo iptables -S 2>&1 | grep -iE "DROP|REJECT" | head -40

            echo "--- geo/deny en configs nginx (captain.conf + manuales) ---"
            sudo grep -rniE "deny |geo |geoip|limit_req|allow " /captain/generated/nginx/conf.d/ 2>&1 | head -40

            echo "--- ipset (listas de bloqueo) ---"
            sudo ipset list -n 2>&1 || echo "sin ipset"

            echo "--- crowdsec / otros WAF ---"
            command -v cscli >/dev/null 2>&1 && sudo cscli decisions list 2>&1 | head -30 || echo "sin crowdsec"
