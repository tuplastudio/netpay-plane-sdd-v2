name: One-off - inspeccionar mounts de logs captain-nginx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -uo pipefail
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            echo "--- mounts de $NGX ---"
            docker inspect "$NGX" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Type}}){{"\n"}}{{end}}' 2>&1

            echo "--- fail2ban instalado? ---"
            command -v fail2ban-client >/dev/null 2>&1 && echo "si, binario en $(command -v fail2ban-client)" || echo "no instalado"
            command -v fail2ban-server >/dev/null 2>&1 && dpkg -l fail2ban 2>&1 | tail -3

            echo "--- logrotate existente para nginx/docker ---"
            ls /etc/logrotate.d/ 2>&1 | grep -iE "docker|nginx" || echo "sin logrotate especifico"
