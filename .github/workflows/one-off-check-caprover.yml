name: One-off - carga, conntrack y exec lento

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-caprover.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: diagnostico
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -uo pipefail
            echo "--- uptime / load ---"
            uptime

            echo "--- memoria detallada ---"
            free -h
            cat /proc/meminfo | grep -iE "^MemAvailable|^MemFree|^SwapTotal|^Dirty"

            echo "--- conntrack (tabla NAT/firewall) ---"
            cat /proc/sys/net/netfilter/nf_conntrack_max 2>&1 || echo "sin nf_conntrack_max"
            cat /proc/sys/net/netfilter/nf_conntrack_count 2>&1 || echo "sin nf_conntrack_count"

            echo "--- docker info rapido (sin exec) ---"
            timeout 10 docker ps --format '{{.Names}} {{.Status}}' | grep -E 'captain|commerce'

            echo "--- top procesos por memoria ---"
            ps aux --sort=-%mem 2>&1 | head -12

            echo "--- dmesg reciente (oom/throttle/conntrack full) ---"
            sudo dmesg -T 2>&1 | tail -40
