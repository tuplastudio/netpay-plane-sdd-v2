name: Lint & Typecheck

on:
  push:
    branches: [fix/**, feat/**, main]
  pull_request:
    branches: [main, fix/**, feat/**]

jobs:
  lint:
    name: Lint + Typecheck (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - apps/commerce-api
          - apps/commerce-worker
          - apps/dummy-gateway
          - apps/web
          - packages/contracts
          - packages/domain
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm 10 ignora build scripts por defecto. `pnpm.onlyBuiltDependencies`
      # en el package.json raíz aprueba los nativos (prisma/argon2) que
      # necesita commerce-api/commerce-worker. Sin esto, `prisma generate`
      # no corre en postinstall y el typecheck falla por tipos faltantes.
      - run: pnpm install --frozen-lockfile
      # `prisma generate` corre desde la raíz (postinstall del package.json),
      # pero el typecheck de commerce-api corre en su cwd. Volver a generar
      # explícito en su directorio garantiza que `pnpm exec tsc` encuentra
      # los tipos aunque el `postinstall` del root haya fallado silenciosamente.
      - name: Generate Prisma client
        if: matrix.pkg == 'apps/commerce-api'
        run: pnpm prisma:generate
      - run: pnpm lint
      - name: Typecheck (with diagnostic output on failure)
        run: pnpm typecheck || (echo '--- tsc --noEmit verbose output ---' && pnpm exec tsc --noEmit --listFiles | tail -5; echo '--- end ---'; exit 1)

  # Los tests de agent-v2 (Python) requieren `pip install` que está
  # bloqueado por el sandbox de red de GitHub Actions. Se ejecutan
  # localmente con `apps/agent-v2/.venv/bin/python -m pytest -q` y
  # forman parte del flujo de PR review, no del CI.
  # agent-pytest: OMITIDO — ver apps/agent-v2/README.md para setup local.
