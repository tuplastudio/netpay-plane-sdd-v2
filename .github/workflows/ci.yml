name: Lint & Typecheck

on:
  push:
    branches: [fix/**, feat/**, main]
  pull_request:
    branches: [main, fix/**, feat/**]

jobs:
  lint:
    name: Lint + Typecheck (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - apps/commerce-api
          - apps/commerce-worker
          - apps/dummy-gateway
          - apps/web
          - packages/contracts
          - packages/domain
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  agent-pytest:
    name: Agent Python tests (agent-v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-v2/requirements.txt
      - working-directory: apps/agent-v2
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
