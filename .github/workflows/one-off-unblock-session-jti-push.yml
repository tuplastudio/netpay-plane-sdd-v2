name: One-off - desbloquear db push de Session.accessJti

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-unblock-session-jti-push.yml"
  workflow_dispatch: {}

jobs:
  push-schema:
    name: prisma db push --accept-data-loss (columna nueva, sin filas existentes)
    runs-on: ubuntu-latest
    steps:
      - name: db push
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && pnpm exec prisma db push --skip-generate --accept-data-loss"
