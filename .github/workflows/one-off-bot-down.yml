name: One-off - diagnostico bot no contesta (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-bot-down.yml"
  workflow_dispatch: {}

jobs:
  diag:
    name: traceback completo + todas las conexiones/tenants
    runs-on: ubuntu-latest
    steps:
      - name: Diag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            echo "=== ultimas 400 lineas agent-v2 (crudo) ==="
            $DC logs --since 2h agent-v2 2>&1 | tail -400

            echo ""
            echo "=== todas las conexiones whatsapp ==="
            $DC exec -T -w /repo/apps/commerce-api commerce-api node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const conns = await p.\$queryRawUnsafe(\"select t.name as tenant, c.\\\"tenantId\\\", c.provider, c.status, c.\\\"phoneNumber\\\" from \\\"WhatsAppConnection\\\" c join \\\"Tenant\\\" t on t.id = c.\\\"tenantId\\\"\");
              for (const c of conns) console.log(c.tenant, c.tenantId, c.provider, c.status, c.phoneNumber);
              await p.\$disconnect();
            })().catch((e) => { console.error('ERR', e.message); process.exit(1); });
            "
