name: One-off - verificación del flujo de cotización del agente en prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-quote-flow-check.yml"

jobs:
  check:
    name: Esperar el deploy, correr una cotización real y volcar errores
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            WANT_VERSION="2.2.0"
            echo "=== esperar a que agent-v2 sirva la versión $WANT_VERSION (deploy-backend del mismo push) ==="
            for i in $(seq 1 90); do
              GOT=$($DC exec -T agent-v2 python -c "import httpx; print(httpx.get('http://localhost:8010/healthz', timeout=5).json().get('version'))" 2>/dev/null || echo "?")
              echo "  intento $i: version=$GOT"
              [ "$GOT" = "$WANT_VERSION" ] && break
              sleep 10
            done

            echo "=== conocimiento por tenant en el volumen ==="
            $DC exec -T agent-v2 sh -c 'echo "KNOWLEDGE_DIR=$KNOWLEDGE_DIR"; ls -la "$KNOWLEDGE_DIR" 2>/dev/null; ls -R "$KNOWLEDGE_DIR/tenants" 2>/dev/null | head -20' || true

            echo "=== conversación de cotización real (demo-store) ==="
            START_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            $DC exec -T agent-v2 python - <<'PY'
            import asyncio, os, uuid, httpx
            from app.commerce import CommerceClient
            tenant = "8e3ecbd4-e06c-49a7-a3be-fa18f9af413f"
            conv = str(uuid.uuid4())
            key = os.environ["AGENT_INTERNAL_KEY"]
            scopes = ["catalog.read","quotes.read","quotes.write","orders.read","orders.write",
                      "customers.read","chat.read","chat.write"]

            async def pick():
                v = await CommerceClient(tenant_id=tenant).search_products(None, limit=100)
                ok = [x for x in v if x.get("stock") is None or float(x.get("stock") or 0) > 0]
                print("variantes activas:", len(v), "| con existencia:", len(ok))
                return (ok or v)[0]
            variant = asyncio.run(pick())
            print("producto elegido:", variant["title"], "|", variant["sku"], "| $", variant["price"])

            def show(body):
                print("  stage:", body.get("stage"), "| engine:", body.get("engine"), "| handoff:", body.get("handoff"), "| ms:", body.get("latencyMs"))
                print("  cart:", [(c.get("title"), c.get("quantity")) for c in body.get("cart", [])])
                print("  quote:", body.get("quote"), "| checkout:", body.get("checkout"))
                print("  attachment:", bool(body.get("attachment")), "| reply:", (body.get("reply") or "")[:400].replace("\n", " / "))

            ok = True
            with httpx.Client(base_url="http://localhost:8010", headers={"x-internal-key": key}, timeout=90) as c:
                for i, text in enumerate([
                    f"hola, quiero 2 de {variant['title']}, me lo mandas a domicilio",
                    "sí, emítela. soy QA Agente Borrar",
                    "qué llevaba la cotización que me mandaste?",
                    "gracias, luego te digo",
                ]):
                    print("\nUSER:", text)
                    r = c.post("/chat", json={"tenantId": tenant, "conversationId": conv, "channel": "whatsapp",
                                              "customerPhone": "5210000000001", "principalScopes": scopes, "text": text})
                    print("  http:", r.status_code)
                    body = r.json()
                    show(body)
                    if i == 0 and body.get("quote"):
                        print("  !! cotizó sin tener el nombre del cliente")
                        ok = False
                    if i == 1 and not (body.get("quote") and body.get("checkout") and body.get("attachment")):
                        ok = False

                print("\n=== mensajes de herramientas del hilo ===")
                m = c.get(f"/conversations/{conv}/messages", params={"tenantId": tenant, "limit": 80})
                data = m.json()
                msgs = data if isinstance(data, list) else data.get("messages") or data.get("items") or []
                for x in msgs:
                    if x.get("role") == "tool" or x.get("toolCalls"):
                        print(x.get("role"), "|", x.get("tool") or "", "|", str(x.get("text") or "")[:400].replace("\n", " / "), "|", x.get("toolCalls") or "")
                d = c.delete(f"/conversations/{conv}", params={"tenantId": tenant})
                print("\ncleanup hilo:", d.status_code)
            print("\nRESULTADO COTIZACION:", "OK" if ok else "FALLO (ver arriba: cotizó sin nombre o falta quote/checkout/pdf en el turno 2)")
            PY

            echo ""
            echo "=== commerce-api: 4xx/5xx con detalle desde el inicio de la prueba ==="
            ($DC logs --since "$START_TS" commerce-api 2>&1 | grep -E -A 6 -e "-> (4|5)[0-9]{2}" | grep -vE "^\s+at " | tail -60 | cut -c1-300) || echo "(nada)"
            echo ""
            echo "=== commerce-api: 5xx últimas 48h con mensaje de Prisma ==="
            ($DC logs --since 48h commerce-api 2>&1 | grep -E -A 4 -e "-> 5[0-9]{2}" | grep -E -e "-> 5|Inconsistent|Unique|does not exist|Foreign|Invalid|Error:" | grep -vE "^\s+at " | tail -40 | cut -c1-300) || echo "(nada)"
            echo ""
            echo "=== agent-v2: warnings/errores desde el inicio de la prueba ==="
            ($DC logs --since "$START_TS" agent-v2 2>&1 | grep -iE "warning|error|traceback|401|User not found" | grep -vE "DeprecationWarning|Pydantic serializer|parallel_tool_calls" | tail -30 | cut -c1-300) || echo "(nada)"
