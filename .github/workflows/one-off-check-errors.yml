name: One-off - probar la key de plataforma de OpenRouter directamente

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-errors.yml"

jobs:
  test:
    name: Confirmar si OPENROUTER_KEY_REF de plataforma es válida ahora mismo
    runs-on: ubuntu-latest
    steps:
      - name: Direct OpenRouter call
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 python -c "
            import os, urllib.request, urllib.error, json
            key = os.environ.get('OPENROUTER_KEY_REF', '')
            print('key prefix/len:', key[:12], len(key))
            req = urllib.request.Request(
                'https://openrouter.ai/api/v1/chat/completions',
                data=json.dumps({'model': os.environ.get('MODEL_ID','openai/gpt-4o-mini'), 'messages':[{'role':'user','content':'ping'}], 'max_tokens':5}).encode(),
                headers={'authorization': f'Bearer {key}', 'content-type': 'application/json'},
                method='POST',
            )
            try:
                with urllib.request.urlopen(req, timeout=20) as r:
                    print('HTTP', r.status, r.read().decode()[:200])
            except urllib.error.HTTPError as e:
                print('HTTP', e.code, e.read().decode()[:300])
            "
            echo ""
            echo "=== ¿el tenant demo-store todavía tiene key propia después del PUT anterior? ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 python -c "
            import json, os
            p = os.path.join(os.environ.get('AGENT_SETTINGS_DIR','/data/agent-v2/settings'), '8e3ecbd4-e06c-49a7-a3be-fa18f9af413f.json')
            d = json.load(open(p))
            print('openrouter_api_key_encrypted presente:', bool(d.get('openrouter_api_key_encrypted')))
            print('claves guardadas:', sorted(d.keys()))
            "
