name: One-off - diagnóstico del 401 de OpenRouter en agent-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-errors.yml"

jobs:
  check:
    name: Contexto + qué tenant tiene su propia key de OpenRouter
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra

            echo "=== conteo de 401 'User not found' por hora (desde hace 24h) ==="
            (docker compose -f compose.prod.yaml --env-file .env.prod logs --since 24h --timestamps agent-v2 2>&1 \
              | grep "User not found" | cut -c1-16 | sort | uniq -c) || echo "(sin coincidencias)"

            echo ""
            echo "=== settings por tenant en disco (AGENT_SETTINGS_DIR): ¿key propia de OpenRouter? ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 python -c "
            import json, os
            d = os.environ.get('AGENT_SETTINGS_DIR', '/data/agent-v2/settings')
            if not os.path.isdir(d):
                print('sin directorio', d); raise SystemExit
            for name in sorted(os.listdir(d)):
                if not name.endswith('.json'):
                    continue
                try:
                    data = json.load(open(os.path.join(d, name)))
                except Exception as e:
                    print(name, 'ILEGIBLE', e); continue
                has_key = bool(data.get('openrouter_api_key_encrypted'))
                print(name, '-> key propia:', has_key, '| model_override:', data.get('model_id') or data.get('model'))
            "

            echo ""
            echo "=== tenants conocidos (slug <-> id) ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            p.\$queryRawUnsafe('select id, slug from \"Tenant\" order by \"createdAt\" asc').then((r) => { console.log(JSON.stringify(r)); return p.\$disconnect(); });
            "

            echo ""
            echo "=== OPENROUTER_KEY_REF de plataforma (solo prefijo/longitud) ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 sh -c 'echo "${OPENROUTER_KEY_REF:0:12}... (len=${#OPENROUTER_KEY_REF})"'
