name: One-off - check final imssbienestar.tupla.dev (sin credenciales)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-imssbienestar-final-check.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: curl desde el runner de GitHub (internet real)
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          set -x
          curl -sk -m 10 -v https://imssbienestar.tupla.dev/ 2>&1 | tail -30
