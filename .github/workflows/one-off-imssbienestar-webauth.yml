name: One-off - credenciales de webauth para imssbienestar.tupla.dev

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-imssbienestar-webauth.yml"
  workflow_dispatch: {}

jobs:
  set-webauth:
    name: agregar IMSSBIENESTAR_WEBAUTH_USER/PASSWORD si faltan (idempotente)
    runs-on: ubuntu-latest
    steps:
      - name: Set
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/netpay/infra/.env.prod
            if grep -q '^IMSSBIENESTAR_WEBAUTH_USER=' "$ENV_FILE" 2>/dev/null; then
              echo "Ya presentes; no se tocan"
              exit 0
            fi
            {
              printf 'IMSSBIENESTAR_WEBAUTH_USER=%s\n' "tupla"
              printf 'IMSSBIENESTAR_WEBAUTH_PASSWORD=%s\n' "W3miBFNaF92Qk9HGz46P"
            } | sudo tee -a "$ENV_FILE" >/dev/null
            echo "OK: credenciales agregadas a $ENV_FILE"
