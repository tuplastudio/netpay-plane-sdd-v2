name: One-off - reset owner@demo.local password

# Disparador `push` filtrado al propio archivo: el workflow se registra en GitHub
# (las acciones de este repo están todas en push-trigger, ver deploy-backend /
# Lint / one-off-*). El reset corre una vez, después se borra este workflow.
#
# La contraseña vive en OWNER_DEMO_RESET_PASSWORD (GitHub Secret, NO en logs)
# y se pasa al contenedor como env var, no como argv, para que `docker exec`
# no la muestre en `ps`/logs del host.

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-reset-owner-demo.yml"

jobs:
  reset:
    name: Reset password en prod (owner@demo.local)
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via commerce-api container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            # Hash con los MISMOS parámetros que PasswordService
            # (apps/commerce-api/src/auth/password.service.ts): argon2id,
            # memoryCost=19456, timeCost=2, parallelism=1. `argon2.verify` lee
            # los parámetros del hash codificado, así que cambiarlos acá solo
            # alargaría el hasheo sin afectar la verificación.
            EMAIL="owner@demo.local"
            $DC exec -T -e RESET_PASSWORD="${{ secrets.OWNER_DEMO_RESET_PASSWORD }}" commerce-api \
              sh -c "cd apps/commerce-api && node -e '
                const { PrismaClient } = require(\"@prisma/client\");
                const argon2 = require(\"argon2\");
                const prisma = new PrismaClient();
                (async () => {
                  const hash = await argon2.hash(process.env.RESET_PASSWORD, {
                    type: argon2.argon2id,
                    memoryCost: 19456,
                    timeCost: 2,
                    parallelism: 1,
                  });
                  const user = await prisma.user.update({
                    where: { email: \"$EMAIL\" },
                    data: { passwordHash: hash },
                    select: { id: true, email: true },
                  });
                  console.log(\"OK password updated for\", user.email, \"id=\" + user.id);
                  await prisma.\$disconnect();
                })().catch((e) => {
                  console.error(\"FAIL\", e.message);
                  process.exit(1);
                });
              '"
