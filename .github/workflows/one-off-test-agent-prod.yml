name: One-off - prueba real del agente en producción

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-test-agent-prod.yml"

jobs:
  test:
    name: POST /chat contra agent-v2 en el droplet (canal whatsapp)
    runs-on: ubuntu-latest
    steps:
      # Corre DENTRO del contenedor de agent-v2 (no está publicado al host):
      # mismo AGENT_INTERNAL_KEY, misma key de OpenRouter del tenant, mismo
      # commerce-api. Es exactamente lo que le manda commerce-api al recibir
      # un WhatsApp. No manda nada a WhatsApp: agent-v2 solo contesta JSON.
      - name: Chat turns inside agent-v2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            echo "=== agent-v2 /readyz ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 python - <<'PYEOF'
            import json, os, time, urllib.request, urllib.error

            KEY = os.environ["AGENT_INTERNAL_KEY"]
            TENANT = "8e3ecbd4-e06c-49a7-a3be-fa18f9af413f"
            CONV = f"diag-ci-{int(time.time())}"
            SCOPES = ["catalog.read", "quotes.read", "quotes.write", "orders.read", "orders.write", "chat.read", "chat.write"]

            def get(path):
                req = urllib.request.Request(f"http://localhost:8010{path}", headers={"x-internal-key": KEY})
                with urllib.request.urlopen(req, timeout=20) as r:
                    return json.loads(r.read().decode())

            def chat(text):
                # Sin customerPhone ni datos personales: no debe crear clientes reales en el tenant.
                body = {"tenantId": TENANT, "conversationId": CONV, "text": text, "channel": "whatsapp",
                        "principalScopes": SCOPES}
                req = urllib.request.Request("http://localhost:8010/chat", data=json.dumps(body).encode(),
                                             headers={"content-type": "application/json", "x-internal-key": KEY}, method="POST")
                t0 = time.time()
                try:
                    with urllib.request.urlopen(req, timeout=60) as r:
                        d = json.loads(r.read().decode())
                except urllib.error.HTTPError as e:
                    print("HTTP", e.code, e.read().decode()[:400]); return None
                d["_ms"] = int((time.time() - t0) * 1000)
                return d

            print(json.dumps(get("/readyz")))
            print("=== turno 1 ===")
            d = chat("hola, quiero cotizar pintura para una barda exterior de 100 m2")
            if d:
                print("engine:", d.get("engine"), "| intent:", d.get("intent"), "| stage:", d.get("stage"), "| handoff:", d.get("handoff"), "| ms:", d["_ms"], "| latencyMs:", d.get("latencyMs"))
                print("tools:", [t.get("tool") for t in d.get("toolCalls", [])])
                print("reply:", (d.get("reply") or "")[:700])
            print("=== turno 2 (continuidad, sin datos personales) ===")
            d = chat("la de 19 litros, ¿cuánto rinde y qué precio tiene?")
            if d:
                print("engine:", d.get("engine"), "| intent:", d.get("intent"), "| ms:", d["_ms"])
                print("tools:", [(t.get("tool"), (t.get("result") or "")[:60]) for t in d.get("toolCalls", [])])
                print("reply:", (d.get("reply") or "")[:500])
            print("=== metrics ===")
            print(json.dumps(get("/metrics")))
            PYEOF
            echo "=== limpieza: borrar el hilo de prueba ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-v2 python - <<'PYEOF'
            import os, urllib.request, glob
            # El conversationId lleva timestamp; se borran todos los hilos diag-ci-* de este tenant.
            KEY = os.environ["AGENT_INTERNAL_KEY"]
            import sqlite3
            db = os.path.join(os.environ.get("AGENT_V2_DATA_DIR", "/data/agent-v2"), "threads.sqlite")
            try:
                con = sqlite3.connect(db)
                rows = con.execute("select distinct thread_id from checkpoints where thread_id like '%diag-ci-%'").fetchall()
                print("hilos de prueba:", [r[0] for r in rows])
                for (tid,) in rows:
                    conv = tid.split(":", 1)[1] if ":" in tid else tid
                    tenant = tid.split(":", 1)[0] if ":" in tid else ""
                    req = urllib.request.Request(f"http://localhost:8010/conversations/{conv}?tenantId={tenant}", headers={"x-internal-key": KEY}, method="DELETE")
                    try:
                        with urllib.request.urlopen(req, timeout=20) as r:
                            print("DELETE", conv, r.status)
                    except Exception as e:
                        print("DELETE", conv, "->", e)
            except Exception as e:
                print("limpieza omitida:", e)
            PYEOF
