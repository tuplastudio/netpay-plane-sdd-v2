name: One-off - diagnosticar conversación 3422e0ea

# Disparador `push` filtrado al propio archivo: las acciones de este repo
# están todas en push-trigger; un workflow_dispatch-only no se registra.

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-diag-conv-3422e0ea.yml"

jobs:
  diag:
    name: Inspeccionar thread y últimos turnos
    runs-on: ubuntu-latest
    steps:
      - name: Dump del estado de la conversación + logs recientes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            # 1) Estado del hilo en LangGraph: failure_streak, handoff, handoff_reason,
            #    stage, últimos mensajes. Si `failure_streak` se resetea solo o
            #    `handoff=True` no persiste, lo veremos acá.
            #
            # `runtime` es singleton a nivel de proceso: el `docker exec` arranca
            # un proceso NUEVO, así que hay que llamar `start()` antes de leer.
            echo "=== ESTADO DEL HILO (LangGraph) ==="
            $DC exec -T agent-v2 python -c "
            import asyncio
            from app.runtime import runtime
            cid = '3422e0ea-9751-4da7-b8b5-a4d0d01c5081'
            tid = f'demo-store:{cid}'
            async def main():
                await runtime.start()
                snap = await runtime.agent.aget_state({'configurable': {'thread_id': tid}})
                v = dict(snap.values or {})
                print('thread_id:', tid)
                print('handoff:', v.get('handoff'))
                print('stage:', v.get('stage'))
                print('handoff_reason:', v.get('handoff_reason'))
                print('failure_streak:', v.get('failure_streak'))
                print('keys:', sorted(k for k in v.keys() if not k.startswith('_')))
                msgs = v.get('messages') or []
                print('total messages:', len(msgs))
                for m in msgs[-6:]:
                    cls = type(m).__name__
                    c = getattr(m, 'content', '')
                    if isinstance(c, list):
                        c = ' | '.join(b.get('text', '') if isinstance(b, dict) else str(b) for b in c)
                    print(f'  {cls}: {(c or '')[:140]!r}')
                await runtime.stop()
            asyncio.run(main())
            "

            # 1b) sqlite directo del checkpoint para confirmar que el archivo
            # tiene contenido. La config usa data_dir = AGENT_V2_DATA_DIR, no
            # AGENT_CHECKPOINT_DIR, así que el archivo está en
            # /data/agent-v2/threads.sqlite (no /checkpoints/).
            echo
            echo "=== ARCHIVO DE CHECKPOINT ==="
            $DC exec -T agent-v2 sh -c "ls -la /data/agent-v2/threads.sqlite /data/agent-v2/checkpoints/ 2>&1 | head -10"
            $DC exec -T agent-v2 sh -c "which sqlite3 || (apt-get update -qq && apt-get install -y -qq sqlite3 >/dev/null && which sqlite3)" 2>&1 | tail -2
            $DC exec -T agent-v2 sqlite3 /data/agent-v2/threads.sqlite 'SELECT count(*) AS total FROM checkpoints;' 2>&1 | head -3
            $DC exec -T agent-v2 sqlite3 /data/agent-v2/threads.sqlite "SELECT count(*) FROM checkpoints WHERE thread_id LIKE '%3422e0ea%';" 2>&1 | head -3

            # 2) Mensajes de WhatsApp de este cliente (lo que el agente vio).
            echo
            echo "=== ÚLTIMOS MENSAJES DEL HILO EN LA BD (whatsapp) ==="
            $DC exec -T commerce-api node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            (async () => {
              const conv = await prisma.conversation.findUnique({
                where: { id: '3422e0ea-9751-4da7-b8b5-a4d0d01c5081' },
                select: { id: true, status: true, handoffToHuman: true, handoffUserId: true, lastMessageAt: true },
              });
              console.log('conv:', JSON.stringify(conv));
              const msgs = await prisma.message.findMany({
                where: { conversationId: '3422e0ea-9751-4da7-b8b5-a4d0d01c5081' },
                orderBy: { createdAt: 'desc' },
                take: 10,
                select: { id: true, direction: true, status: true, messageType: true, body: true, createdAt: true, errorMessage: true },
              });
              for (const m of msgs.reverse()) {
                console.log(m.createdAt.toISOString(), m.direction, m.status, m.messageType, (m.body || '').slice(0, 100), m.errorMessage ? 'ERR=' + m.errorMessage : '');
              }
              await prisma.\$disconnect();
            })().catch((e) => { console.error('FAIL', e.message); process.exit(1); });
            "

            # 3) Logs del agente para este thread en las últimas 24h.
            echo
            echo "=== LOGS DEL AGENTE (últimas 200 líneas, grep por thread_id) ==="
            $DC logs --tail=2000 agent-v2 2>&1 | grep -E "3422e0ea|fallo del turno|turn\.failure|turn\.handoff" | tail -40 || true
