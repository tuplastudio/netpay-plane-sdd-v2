name: One-off - capacidad del droplet para Langfuse/Flagsmith self-hosteados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-capacity-check.yml"

jobs:
  check:
    name: RAM/disco/CPU y config de CapRover (solo lectura)
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail

            echo "=== CPU ==="
            nproc

            echo ""
            echo "=== RAM ==="
            free -h

            echo ""
            echo "=== disco ==="
            df -h /

            echo ""
            echo "=== uso actual por contenedor ==="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"

            echo ""
            echo "=== contenedores corriendo ==="
            docker ps --format "{{.Names}}"

            echo ""
            echo "=== rootDomain de CapRover (para saber si hay wildcard DNS) ==="
            cat /captain/data/config-captain.json 2>/dev/null | grep -i "rootdomain\|customdomain" || echo "no encontrado / sin acceso"

            echo ""
            echo "=== networks docker ==="
            docker network ls
