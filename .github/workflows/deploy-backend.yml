name: Deploy backend to DO droplet

on:
  push:
    branches: [main]
    paths:
      - "apps/commerce-api/**"
      - "apps/commerce-worker/**"
      - "apps/dummy-gateway/**"
      - "apps/agent-v2/**"
      - "packages/**"
      - "infra/compose.prod.yaml"
      - "infra/initdb/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a desplegar (branch/tag/sha)"
        required: false
        default: ""

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DO droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail

            REF="${{ github.event.inputs.ref }}"
            if [ -z "$REF" ]; then REF="${{ github.ref_name }}"; fi
            echo "Desplegando ref: $REF"

            # Directorio de build (fresco cada deploy) separado del runtime
            BUILD_DIR="/opt/netpay-build"
            sudo mkdir -p "$BUILD_DIR"
            sudo chown -R deployer:deployer "$BUILD_DIR" 2>/dev/null || true

            # Checkout del repo en el directorio de build
            if [ ! -d "$BUILD_DIR/.git" ]; then
              echo "Clonando repo en $BUILD_DIR"
              cd "$BUILD_DIR"
              git clone --depth 1 --branch "$REF" "https://github.com/tuplastudio/netpay-plane-sdd-v2.git" .
            else
              echo "Actualizando $BUILD_DIR"
              cd "$BUILD_DIR"
              git fetch origin "$REF"
              git checkout "origin/$REF"
            fi

            # .env.prod vive en /opt/netpay (intacto entre deploys). Hacemos
            # symlink desde el build dir para que compose lo encuentre.
            if [ ! -e "$BUILD_DIR/.env.prod" ]; then
              ln -s /opt/netpay/infra/.env.prod "$BUILD_DIR/.env.prod"
            fi

            cd "$BUILD_DIR"
            echo "--- HEAD en build dir ---"
            git rev-parse --short HEAD
            echo "--- Limpiando servicios swarm existentes ---"
            # Los servicios previos (deployados manualmente) usan los mismos
            # nombres que compose.prod.yaml pone en `container_name`. Para
            # que `docker compose up -d` no choque con duplicados, los bajamos
            # primero.
            for svc in netpay_commerce_api netpay_commerce_worker netpay_dummy_gateway netpay_agent_v2 netpay_web; do
              docker service rm "$svc" 2>/dev/null || true
            done
            sleep 5
            echo "--- Construyendo imágenes ---"
            docker compose -f infra/compose.prod.yaml build
            echo "--- Subiendo servicios ---"
            docker compose -f infra/compose.prod.yaml up -d

      - name: Prisma migrate deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
        script: |
          set -euo pipefail
          cd /opt/netpay-build
          docker compose -f infra/compose.prod.yaml exec -T commerce-api \
            pnpm exec prisma migrate deploy || true

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
        script: |
          set -euo pipefail
          cd /opt/netpay-build
          docker compose -f infra/compose.prod.yaml ps
          echo ""
          # Esperar hasta 60s a que el API responda en :14000 (puerto externo)
          for i in $(seq 1 12); do
            if curl -s -m 3 http://localhost:14000/api/v1/healthz | grep -q '"status":"ok"'; then
              echo "OK commerce-api responde en :14000"
              break
            fi
            echo "  intento $i/12: esperando..."
            sleep 5
          done
