name: Deploy backend to DO droplet

on:
  push:
    branches: [main]
    paths:
      - "apps/commerce-api/**"
      - "apps/commerce-worker/**"
      - "apps/dummy-gateway/**"
      - "apps/agent-v2/**"
      - "apps/agent-imssbienestar/**"
      - "packages/**"
      - "infra/compose.prod.yaml"
      - "infra/initdb/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a desplegar (branch/tag/sha)"
        required: false
        default: ""

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DO droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail

            REF="${{ github.event.inputs.ref }}"
            if [ -z "$REF" ]; then REF="${{ github.ref_name }}"; fi
            echo "Desplegando ref: $REF"

            echo "--- Espacio en disco antes del deploy ---"
            df -h / | tail -1

            # PRUNE AL INICIO (no antes del build): el build cache de Docker
            # acumula GBs entre deploys y el disco se llenó tanto que hasta
            # `git fetch` fallaba con "No space left on device" (2026-09-22)
            # ANTES de llegar al prune. -f = sin prompt; -a = TODO el cache,
            # no solo dangling (el build siguiente lo reconstruye, solo
            # tarda un poco más).
            echo "--- Liberando espacio (prune de build cache) ---"
            docker builder prune -af || true
            docker image prune -f || true

            # Directorio de build (fresco cada deploy) separado del runtime
            BUILD_DIR="/opt/netpay-build"
            sudo mkdir -p "$BUILD_DIR"
            sudo chown -R deployer:deployer "$BUILD_DIR" 2>/dev/null || true

            # Checkout del repo en el directorio de build
            if [ ! -d "$BUILD_DIR/.git" ]; then
              echo "Clonando repo en $BUILD_DIR"
              cd "$BUILD_DIR"
              git clone --depth 1 --branch "$REF" "https://github.com/tuplastudio/netpay-plane-sdd-v2.git" .
            else
              echo "Actualizando $BUILD_DIR"
              cd "$BUILD_DIR"
              git fetch origin "$REF"
              git checkout "origin/$REF"
            fi

            cd "$BUILD_DIR"
            echo "--- HEAD en build dir ---"
            git rev-parse --short HEAD

            # El stack real corre como contenedores `docker compose` planos
            # (container_name fijo), NO como servicios de swarm — el droplet
            # también corre CapRover (captain-*), que sí usa swarm, así que
            # `docker service rm` sobre nuestros nombres es un no-op inofensivo.
            # `docker compose up -d` reconoce y recrea en el sitio los
            # contenedores existentes con el mismo nombre; no hace falta
            # bajarlos a mano primero.
            #
            # Se invoca desde infra/ (no con `-f infra/compose.prod.yaml`
            # desde la raíz) porque así quedó establecido el deploy real de
            # este droplet: el project label de los contenedores vivos es
            # `working_dir=.../infra`, y mantener el mismo working dir evita
            # que compose los trate como "de otro proyecto" al recrearlos.
            cd infra

            # `.env.prod` (secretos reales) vive SOLO en el droplet, en
            # /opt/netpay/infra/.env.prod — el checkout fresco de cada deploy
            # no lo trae. El symlink se crea una vez y sobrevive entre deploys
            # porque $BUILD_DIR no se borra (solo se actualiza con fetch).
            if [ ! -e ".env.prod" ]; then
              ln -s /opt/netpay/infra/.env.prod .env.prod
            fi
            test -s .env.prod || { echo "Falta /opt/netpay/infra/.env.prod en el droplet"; exit 1; }

            echo "--- Construyendo imágenes ---"
            docker compose -f compose.prod.yaml --env-file .env.prod build
            echo "--- Subiendo servicios ---"
            # 2026-10-01: entre `build` y `up` desapareció la imagen recién
            # construida (`No such image: infra-commerce-api:latest`) y el
            # `up` murió con commerce-api ya detenido: API caída. Si el `up`
            # falla, reconstruir y reintentar una vez antes de rendirse.
            docker compose -f compose.prod.yaml --env-file .env.prod up -d --remove-orphans || {
              echo "--- up falló; reconstruyendo y reintentando ---"
              docker compose -f compose.prod.yaml --env-file .env.prod build
              docker compose -f compose.prod.yaml --env-file .env.prod up -d --remove-orphans
            }

      - name: Prisma migrate deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            # Este repo NO usa `prisma migrate deploy`: las migraciones son
            # archivos planos .sql (documentación de la evolución del
            # esquema) que prisma no reconoce — "No migration found" (y el
            # `pnpm exec` en la raíz del workspace además fallaba con
            # "Command prisma not found": prisma es dependencia del paquete
            # commerce-api, no del root). El `|| true` original enmascaraba
            # ambos fallos: el esquema NUNCA se sincronizaba desde este
            # workflow y la BD se desfasaba del código en silencio (pasó con
            # 0014/0015/0016 el 2026-09-22: el contenedor nuevo insertaba
            # columnas que la BD no tenía y la ingesta de WhatsApp fallaba).
            #
            # `prisma db push` diff del schema.prisma contra la BD real y
            # agrega lo que falta (tablas, columnas, índices, FKs). Sin
            # --accept-data-loss se niega a operaciones destructivas: si
            # algo se tendría que borrar, falla ruidosamente y tumbar el
            # deploy — nunca desfasa la base en silencio.
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && pnpm exec prisma db push --skip-generate"

      # RLS de tablas nuevas que no vienen del schema.prisma (vive en SQL
      # plano en cada migrations/00NN): `db push` sincroniza schema.prisma
      # pero NUNCA aplica RLS. Idempotente: DROP POLICY IF EXISTS + CREATE
      # POLICY. current_tenant_id() ya existe en la BD (la creó 0002).
      #
      # LAS CUATRO EN UNA SOLA CONEXIÓN SSH: cada paso `appleboy/ssh-action`
      # abre una conexión nueva y `ufw limit ssh` en el droplet tumba la
      # conexión #7 en <30s cuando build+migrate+RLS pasan de largo cada
      # una por su cuenta (mismo problema que ya se resolvió para los
      # vhosts en 98ec349 — aquí volvió a pasar el 2026-09-29 al separar
      # CannedResponse/CustomerNote en dos pasos propios).
      - name: RLS tablas fuera de schema.prisma (DeliveryZone, ProductImage, CannedResponse, CustomerNote, ApiKeyUsage, DataSource, DataSourceRun, OutboundHook, OutboundHookDelivery)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            # `cd` adentro del exec para que `require('@prisma/client')`
            # resuelva contra apps/commerce-api/node_modules (cwd del exec es
            # /repo, donde @prisma/client no existe como dependencia
            # directa — la primera versión fallaba con MODULE_NOT_FOUND).
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && node -e 'const {PrismaClient}=require(\"@prisma/client\");const p=new PrismaClient();const rls=async(t,force,allowNull)=>{const chk=allowNull?\"(\\\"tenantId\\\" = current_tenant_id() OR \\\"tenantId\\\" IS NULL)\":\"(\\\"tenantId\\\" = current_tenant_id())\";await p.\$executeRawUnsafe(\"ALTER TABLE \\\"\"+t+\"\\\" ENABLE ROW LEVEL SECURITY\");if(force)await p.\$executeRawUnsafe(\"ALTER TABLE \\\"\"+t+\"\\\" FORCE ROW LEVEL SECURITY\");await p.\$executeRawUnsafe(\"DROP POLICY IF EXISTS tenant_isolation ON \\\"\"+t+\"\\\"\");await p.\$executeRawUnsafe(\"CREATE POLICY tenant_isolation ON \\\"\"+t+\"\\\" USING (\\\"tenantId\\\" = current_tenant_id()) WITH CHECK \"+chk+\"\");console.log(\"OK RLS \"+t);};(async()=>{await rls(\"DeliveryZone\",false);await rls(\"ProductImage\",true);await rls(\"CannedResponse\",true);await rls(\"CustomerNote\",false);await rls(\"ApiKeyUsage\",true,true);await rls(\"DataSource\",true);await rls(\"DataSourceRun\",true);await rls(\"OutboundHook\",true);await rls(\"OutboundHookDelivery\",true);await p.\$disconnect();})().catch(e=>{console.error(\"FAIL RLS:\",e.message);process.exit(1);})'"


      # El API público (api-easysell.tupla.dev) y el chat de IMSS-Bienestar
      # (imssbienestar.tupla.dev) se sirven desde captain-nginx de CapRover
      # con vhosts manuales. CapRover regenera captain.conf y puede recrear
      # el contenedor de nginx: ambas cosas borran los vhosts / la conexión a
      # la red del compose (pasó con el API el 2026-09-20). Este paso los deja
      # siempre en pie. Los DOS vhosts van en UNA sola conexión SSH: el
      # droplet tiene `ufw limit ssh` (máx. ~6 conexiones nuevas por 30s
      # desde el mismo origen) y este job ya hace varias; separarlos en dos
      # pasos (dos conexiones) tumbaba el Healthcheck siguiente con
      # "dial tcp ...:22: i/o timeout" (visto 3 veces seguidas el 2026-09-28
      # al agregar el vhost de IMSS-Bienestar como paso aparte).
      - name: Asegurar vhosts en captain-nginx (API + chat IMSS-Bienestar)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            # Cada dominio corre en su propio subshell: un `exit 0/1` de "ya
            # está / nginx -t falló" solo debe saltarse SU bloque, no matar
            # el script entero (bug real: con los dos en el mismo shell, el
            # "ya está presente" de api-easysell (el caso normal, casi todo
            # deploy) hacía `exit 0` y el bloque de imssbienestar de abajo
            # JAMÁS llegaba a correr — encontrado 2026-09-29 tras varias
            # restauraciones manuales que "no debían hacer falta").
            (
            DOMAIN=api-easysell.tupla.dev
            VHOST_FILE=/captain/generated/nginx/conf.d/api-easysell.conf
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            if [ -z "$NGX" ]; then echo "captain-nginx no encontrado; se omite"; exit 0; fi
            if ! docker network inspect infra_netpay_internal --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q captain-nginx; then
              docker network connect infra_netpay_internal "$NGX" && echo "captain-nginx conectado a infra_netpay_internal"
            fi
            if sudo grep -q "commerce-api:4000" "$VHOST_FILE" 2>/dev/null; then
              echo "vhost $DOMAIN presente"
              exit 0
            fi
            echo "vhost $DOMAIN ausente: se restaura"
            sudo tee "$VHOST_FILE" >/dev/null <<'NGINX'
            # Vhost del API del proyecto (commerce-api). Archivo propio, NO dentro
            # de captain.conf: CapRover regenera captain.conf y borra lo manual.
            # Lo restaura deploy-backend.yml en cada deploy si falta.
            server {
                listen 80;
                listen 443 ssl;
                http2 on;
                server_name api-easysell.tupla.dev;
                client_max_body_size 500m;
                resolver 127.0.0.11 valid=10s ipv6=off;
                ssl_certificate     /letencrypt/etc/live/api-easysell.tupla.dev/fullchain.pem;
                ssl_certificate_key /letencrypt/etc/live/api-easysell.tupla.dev/privkey.pem;

                location /.well-known/acme-challenge/ {
                    alias /usr/share/nginx/domains/api-easysell.tupla.dev/.well-known/acme-challenge/;
                }

                set $upstream http://commerce-api:4000;
                location / {
                    proxy_pass $upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 5s;
                    proxy_read_timeout 120s;
                }
            }
            NGINX
            if docker exec "$NGX" nginx -t; then
              docker kill -s HUP "$NGX" && echo "nginx recargado"
            else
              echo "nginx -t falló; se retira el vhost para no romper nginx"
              sudo rm -f "$VHOST_FILE"
              exit 1
            fi
            )

            # ---- Segundo vhost, misma conexión SSH, subshell propio ----
            # Chat de prueba de IMSS-Bienestar. Requiere DNS de
            # imssbienestar.tupla.dev -> este droplet y una app en CapRover
            # para ese dominio (solo para que emita el certificado Let's
            # Encrypt; el tráfico real lo sirve este vhost, no el contenedor
            # que registre CapRover).
            (
            DOMAIN=imssbienestar.tupla.dev
            VHOST_FILE=/captain/generated/nginx/conf.d/imssbienestar.conf
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            if [ -z "$NGX" ]; then echo "captain-nginx no encontrado; se omite"; exit 0; fi
            # OJO: este script corre en el HOST por SSH, no dentro del contenedor
            # de nginx. "/letencrypt/etc/live/..." (usado en el `ssl_certificate`
            # de abajo) es la ruta DENTRO del contenedor; en el host el mismo
            # volumen vive en /captain/data/letencrypt/etc/live/. Con la ruta de
            # adentro, este `if` daba SIEMPRE "no existe" y el vhost de
            # imssbienestar nunca se restauraba solo en un deploy normal (bug
            # encontrado 2026-09-29 junto con el de los subshells de arriba).
            if [ ! -f "/captain/data/letencrypt/etc/live/$DOMAIN/fullchain.pem" ]; then
              echo "Sin certificado para $DOMAIN todavía (crear la app en CapRover primero); se omite el vhost esta corrida"
              exit 0
            fi
            if ! docker network inspect infra_netpay_internal --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q captain-nginx; then
              docker network connect infra_netpay_internal "$NGX" && echo "captain-nginx conectado a infra_netpay_internal"
            fi
            if sudo grep -q "agent-imssbienestar-ui:80" "$VHOST_FILE" 2>/dev/null; then
              echo "vhost $DOMAIN presente"
              exit 0
            fi
            echo "vhost $DOMAIN ausente: se restaura"
            sudo tee "$VHOST_FILE" >/dev/null <<'NGINX'
            # Vhost del chat de prueba de agent-imssbienestar. Archivo propio, NO
            # dentro de captain.conf: CapRover lo regenera y borra lo manual.
            # Lo restaura deploy-backend.yml en cada deploy si falta.
            server {
                listen 80;
                listen 443 ssl;
                http2 on;
                server_name imssbienestar.tupla.dev;
                resolver 127.0.0.11 valid=10s ipv6=off;
                ssl_certificate     /letencrypt/etc/live/imssbienestar.tupla.dev/fullchain.pem;
                ssl_certificate_key /letencrypt/etc/live/imssbienestar.tupla.dev/privkey.pem;

                location /.well-known/acme-challenge/ {
                    alias /usr/share/nginx/domains/imssbienestar.tupla.dev/.well-known/acme-challenge/;
                }

                set $upstream http://agent-imssbienestar-ui:80;
                location / {
                    proxy_pass $upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 5s;
                    proxy_read_timeout 60s;
                }
            }
            NGINX
            if docker exec "$NGX" nginx -t; then
              docker kill -s HUP "$NGX" && echo "nginx recargado"
            else
              echo "nginx -t falló; se retira el vhost para no romper nginx"
              sudo rm -f "$VHOST_FILE"
              exit 1
            fi
            )

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod ps
            echo ""
            # Esperar hasta 60s a que el API responda en :14000 (puerto externo)
            for i in $(seq 1 12); do
              if curl -s -m 3 http://localhost:14000/api/v1/healthz | grep -q '"status":"ok"'; then
                echo "OK commerce-api responde en :14000"
                break
              fi
              echo "  intento $i/12: esperando..."
              sleep 5
            done
            echo ""
            # agent-imssbienestar no publica puerto al host: se checa desde
            # dentro de la red de compose con el propio contenedor de la UI.
            if docker compose -f compose.prod.yaml --env-file .env.prod exec -T agent-imssbienestar-ui \
                wget -q -O - http://agent-imssbienestar:8010/healthz | grep -q ok; then
              echo "OK agent-imssbienestar responde"
            else
              echo "AVISO: agent-imssbienestar no respondió healthz"
            fi
