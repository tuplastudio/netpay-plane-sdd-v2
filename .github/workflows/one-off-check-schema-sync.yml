name: One-off - estado del schema (db push sin flags)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-schema-sync.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: prisma db push --skip-generate (solo lectura del diff, sin aplicar)
    runs-on: ubuntu-latest
    steps:
      - name: db push
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && pnpm exec prisma db push --skip-generate"
            echo "exit code: $?"
