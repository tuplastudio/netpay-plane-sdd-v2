name: One-off - tail de logs de commerce-api

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-tail-commerce-api-logs.yml"
  workflow_dispatch: {}

jobs:
  tail:
    name: solo lectura
    runs-on: ubuntu-latest
    steps:
      - name: tail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod logs commerce-api --tail 200 2>&1
