name: One-off - verificar usuario owner@demo.local

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-user.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura, sin exponer password hash
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            cat <<'NODE_EOF' > /tmp/check-user.js
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            (async () => {
              const user = await p.user.findUnique({
                where: { email: "owner@demo.local" },
                select: { id: true, email: true, isSuperAdmin: true, createdAt: true },
              });
              console.log("USER", JSON.stringify(user));
              if (user) {
                const memberships = await p.membership.findMany({
                  where: { userId: user.id },
                  select: { tenantId: true, role: true, status: true },
                });
                console.log("MEMBERSHIPS", JSON.stringify(memberships));
              }
              await p.$disconnect();
            })().catch((e) => { console.error("FAIL", e.message); process.exit(1); });
            NODE_EOF
            docker compose -f compose.prod.yaml --env-file .env.prod cp /tmp/check-user.js commerce-api:/repo/apps/commerce-api/check-user.js
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api node ./check-user.js
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api rm -f check-user.js
            rm -f /tmp/check-user.js
