name: One-off - aplicar migracion 0020 (CheckoutSession.externalId) antes del deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-apply-0020.yml"

jobs:
  apply:
    name: SQL idempotente con el cliente Prisma del contenedor actual
    runs-on: ubuntu-latest
    steps:
      - name: Apply
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && node -" <<'JS'
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            const stmts = [
              'ALTER TABLE "CheckoutSession" ADD COLUMN IF NOT EXISTS "externalId" TEXT',
              'ALTER TABLE "CheckoutSession" ADD COLUMN IF NOT EXISTS "hostedPath" TEXT',
              'CREATE UNIQUE INDEX IF NOT EXISTS "CheckoutSession_externalId_key" ON "CheckoutSession"("externalId")',
              'CREATE INDEX IF NOT EXISTS "CheckoutSession_orderId_status_idx" ON "CheckoutSession"("orderId", "status")',
            ];
            (async () => {
              for (const s of stmts) { await p.$executeRawUnsafe(s); console.log("OK:", s.slice(0, 70)); }
              const cols = await p.$queryRawUnsafe(
                "select column_name from information_schema.columns where table_name='CheckoutSession' and column_name in ('externalId','hostedPath')"
              );
              console.log("columnas:", JSON.stringify(cols));
              await p.$disconnect();
            })().catch((e) => { console.error("FAIL:", e.message); process.exit(1); });
            JS
