name: One-off - emitir cert Let's Encrypt para imssbienestar.tupla.dev

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-imssbienestar-cert.yml"
  workflow_dispatch: {}

jobs:
  issue-cert:
    name: certbot webroot + vhost final en captain-nginx
    runs-on: ubuntu-latest
    steps:
      - name: Emitir cert y activar vhost
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            DOMAIN=imssbienestar.tupla.dev
            VHOST_FILE=/captain/generated/nginx/conf.d/imssbienestar.conf
            WEBROOT=/captain/generated/static/domains/$DOMAIN
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            if [ -z "$NGX" ]; then echo "captain-nginx no encontrado"; exit 1; fi

            if [ -f "/captain/data/letencrypt/etc/live/$DOMAIN/fullchain.pem" ]; then
              echo "Cert ya existe para $DOMAIN; se salta la emisión"
            else
              echo "--- 1/4: webroot + vhost temporal (solo HTTP, sin ssl_certificate) ---"
              sudo mkdir -p "$WEBROOT"
              sudo tee "$VHOST_FILE" >/dev/null <<NGINX
            server {
                listen 80;
                server_name $DOMAIN;
                location /.well-known/acme-challenge/ {
                    alias /usr/share/nginx/domains/$DOMAIN/.well-known/acme-challenge/;
                }
                location / {
                    return 404;
                }
            }
            NGINX
              docker exec "$NGX" nginx -t
              docker kill -s HUP "$NGX"
              sleep 2

              echo "--- 2/4: certbot (ACME HTTP-01 via webroot) ---"
              docker run --rm \
                -v /captain/data/letencrypt/etc:/out:rw \
                -v "$WEBROOT":/var/www/html:rw \
                certbot/certbot certonly \
                --webroot -w /var/www/html \
                -d "$DOMAIN" \
                --non-interactive --agree-tos --email admin@tupla.dev \
                --config-dir /out/config --work-dir /out/work --logs-dir /out/logs

              echo "--- 3/4: copiar cert al path que usa nginx ---"
              sudo mkdir -p "/captain/data/letencrypt/etc/live/$DOMAIN"
              sudo cp "/captain/data/letencrypt/etc/config/live/$DOMAIN/fullchain.pem" \
                      "/captain/data/letencrypt/etc/live/$DOMAIN/"
              sudo cp "/captain/data/letencrypt/etc/config/live/$DOMAIN/privkey.pem" \
                      "/captain/data/letencrypt/etc/live/$DOMAIN/"

              echo "--- 4/4: script + cron de renovación (mismo patrón que api-easysell) ---"
              sudo tee /usr/local/bin/certbot-renew-imssbienestar.sh >/dev/null <<'RENEW'
            #!/bin/bash
            set -euo pipefail
            DOMAIN=imssbienestar.tupla.dev
            docker run --rm \
              -v /captain/data/letencrypt/etc:/out:rw \
              -v /captain/generated/static/domains/$DOMAIN:/var/www/html:rw \
              certbot/certbot renew --webroot -w /var/www/html -d $DOMAIN \
              --config-dir /out/config --work-dir /out/work --logs-dir /out/logs
            if [ -f /out/config/live/$DOMAIN/fullchain.pem ]; then
              cp /out/config/live/$DOMAIN/fullchain.pem /captain/data/letencrypt/etc/live/$DOMAIN/
              cp /out/config/live/$DOMAIN/privkey.pem /captain/data/letencrypt/etc/live/$DOMAIN/
              docker kill -s HUP $(docker ps --format "{{.Names}}" | grep captain-nginx | head -1)
            fi
            RENEW
              sudo chmod +x /usr/local/bin/certbot-renew-imssbienestar.sh
              (sudo crontab -l 2>/dev/null | grep -v certbot-renew-imssbienestar; echo "0 3 * * * /usr/local/bin/certbot-renew-imssbienestar.sh") | sudo crontab -
            fi

            echo "--- vhost final (proxy a agent-imssbienestar-ui, con SSL) ---"
            if ! docker network inspect infra_netpay_internal --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q captain-nginx; then
              docker network connect infra_netpay_internal "$NGX" && echo "captain-nginx conectado a infra_netpay_internal"
            fi
            sudo tee "$VHOST_FILE" >/dev/null <<NGINX
            server {
                listen 80;
                listen 443 ssl;
                http2 on;
                server_name $DOMAIN;
                resolver 127.0.0.11 valid=10s ipv6=off;
                ssl_certificate     /letencrypt/etc/live/$DOMAIN/fullchain.pem;
                ssl_certificate_key /letencrypt/etc/live/$DOMAIN/privkey.pem;

                location /.well-known/acme-challenge/ {
                    alias /usr/share/nginx/domains/$DOMAIN/.well-known/acme-challenge/;
                }

                set \$upstream http://agent-imssbienestar-ui:80;
                location / {
                    proxy_pass \$upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_connect_timeout 5s;
                    proxy_read_timeout 60s;
                }
            }
            NGINX
            docker exec "$NGX" nginx -t
            docker kill -s HUP "$NGX"
            echo "OK: $DOMAIN con SSL activo"
