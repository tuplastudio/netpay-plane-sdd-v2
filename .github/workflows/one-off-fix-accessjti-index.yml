name: One-off - corregir indice parcial de Session.accessJti y sincronizar schema

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-fix-accessjti-index.yml"
  workflow_dispatch: {}

jobs:
  fix:
    name: drop indice viejo + db push --accept-data-loss
    runs-on: ubuntu-latest
    steps:
      - name: fix
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra

            cat <<'NODE_EOF' > /tmp/drop-index.js
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            (async () => {
              await p.$executeRawUnsafe('DROP INDEX IF EXISTS "Session_accessJti_key"');
              console.log("dropped Session_accessJti_key (if it existed)");
              await p.$disconnect();
            })().catch((e) => { console.error("FAIL", e.message); process.exit(1); });
            NODE_EOF
            docker compose -f compose.prod.yaml --env-file .env.prod cp /tmp/drop-index.js commerce-api:/repo/apps/commerce-api/drop-index.js
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api node ./drop-index.js
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api rm -f drop-index.js
            rm -f /tmp/drop-index.js

            echo "=== db push --accept-data-loss ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api \
              sh -c "cd apps/commerce-api && pnpm exec prisma db push --skip-generate --accept-data-loss"
