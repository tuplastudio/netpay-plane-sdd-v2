name: One-off - diagnóstico de WhatsApp (Evolution) en prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-whatsapp-check.yml"

jobs:
  check:
    name: Hilo reciente que pidió estatus de pedido y se quedó sin respuesta
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            cat <<'NODE_EOF' > /tmp/wa-thread.js
            const { PrismaClient } = require("@prisma/client");
            const p = new PrismaClient();
            (async () => {
              const conv = await p.whatsAppConversation.findUnique({
                where: { id: "3422e0ea-9751-4da7-b8b5-a4d0d01c5081" },
              });
              console.log("CONVERSACION", JSON.stringify({
                ...conv,
                externalPhone: conv.externalPhone ? conv.externalPhone.replace(/\d(?=\d{3})/g, "*") : null,
              }));
              const msgs = await p.whatsAppMessage.findMany({
                where: { conversationId: "3422e0ea-9751-4da7-b8b5-a4d0d01c5081" },
                orderBy: { createdAt: "asc" },
              });
              for (const m of msgs) {
                console.log("THREAD", JSON.stringify({
                  createdAt: m.createdAt, direction: m.direction, messageType: m.messageType,
                  status: m.status, errorMessage: m.errorMessage, body: (m.body || "").slice(0, 300),
                }));
              }
              await p.$disconnect();
            })().catch((e) => { console.error("FAIL", e.message); process.exit(1); });
            NODE_EOF
            $DC cp /tmp/wa-thread.js commerce-api:/repo/apps/commerce-api/wa-thread.js
            $DC exec -T -w /repo/apps/commerce-api commerce-api node ./wa-thread.js
            $DC exec -T -w /repo/apps/commerce-api commerce-api rm -f wa-thread.js
            rm -f /tmp/wa-thread.js

            echo "=== agent-v2: version (confirmar que trae el fix de folios) ==="
            $DC exec -T agent-v2 python -c "import httpx; print(httpx.get('http://localhost:8010/healthz', timeout=5).text)" 2>&1 | tail -2

            echo "=== servicios ==="
            $DC ps --format '{{.Service}} {{.State}} {{.Status}}' 2>&1 | head -20

            echo "=== commerce-api: logs últimos 15 min ==="
            ($DC logs --since 15m commerce-api 2>&1 | grep -vE "^\s+at |RouterExplorer|RoutesResolver|InstanceLoader" | tail -200 | cut -c1-400) || echo "(nada)"
            echo "=== agent-v2: logs últimos 15 min ==="
            ($DC logs --since 15m agent-v2 2>&1 | tail -200 | cut -c1-400) || echo "(nada)"
