name: One-off - generar IMSSBIENESTAR_INTERNAL_KEY en .env.prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-imssbienestar-internal-key.yml"
  workflow_dispatch: {}

jobs:
  set-key:
    name: agregar la var si falta (idempotente)
    runs-on: ubuntu-latest
    steps:
      - name: Set
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/netpay/infra/.env.prod
            if grep -q '^IMSSBIENESTAR_INTERNAL_KEY=' "$ENV_FILE" 2>/dev/null; then
              echo "IMSSBIENESTAR_INTERNAL_KEY ya presente; no se toca"
              exit 0
            fi
            KEY=$(openssl rand -hex 32)
            printf '\nIMSSBIENESTAR_INTERNAL_KEY=%s\n' "$KEY" | sudo tee -a "$ENV_FILE" >/dev/null
            echo "OK: IMSSBIENESTAR_INTERNAL_KEY agregada a $ENV_FILE"
