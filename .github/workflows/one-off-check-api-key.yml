name: One-off - revisar una API key por prefijo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-api-key.yml"

jobs:
  check:
    name: Consultar ApiKey por prefijo (solo lectura)
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"
            $DC exec -T -w /repo/apps/commerce-api commerce-api node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const key = await p.apiKey.findFirst({
                where: { prefix: 'npk_92a3e963dccd' },
                include: { tenant: { select: { id: true, name: true, slug: true } } },
              });
              if (!key) { console.log('NOT_FOUND'); await p.\$disconnect(); return; }
              console.log(JSON.stringify({
                id: key.id,
                name: key.name,
                prefix: key.prefix,
                tenantId: key.tenantId,
                tenant: key.tenant ? { name: key.tenant.name, slug: key.tenant.slug } : null,
                isGlobal: key.tenantId === null,
                scopes: key.scopes,
                createdById: key.createdById,
                createdAt: key.createdAt,
                expiresAt: key.expiresAt,
                revokedAt: key.revokedAt,
                lastUsedAt: key.lastUsedAt,
              }, null, 2));
              await p.\$disconnect();
            })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
