name: One-off - set FLAGSMITH_DB_PASSWORD en .env.prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-set-flagsmith-db-password.yml"

jobs:
  set:
    name: Generar la password en el server (idempotente, nunca sale del droplet)
    runs-on: ubuntu-latest
    steps:
      - name: Set password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra

            if grep -qE "^FLAGSMITH_DB_PASSWORD=" .env.prod; then
              echo "FLAGSMITH_DB_PASSWORD ya existe en .env.prod; no se toca"
            else
              PASS=$(openssl rand -base64 32 | tr -d '\n/+=' | head -c 40)
              printf '\nFLAGSMITH_DB_PASSWORD=%s\n' "$PASS" >> .env.prod
              echo "FLAGSMITH_DB_PASSWORD agregado (generado en el server, nunca sale de aqui)"
            fi
