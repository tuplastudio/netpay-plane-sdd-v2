name: One-off - diagnose WhatsApp bot / agent-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-diagnose-bot.yml"

jobs:
  diagnose:
    name: Logs de commerce-api y agent-v2 en el droplet
    runs-on: ubuntu-latest
    steps:
      - name: Fetch status and logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            echo "=== docker compose ps ==="
            docker compose -f compose.prod.yaml --env-file .env.prod ps
            echo ""
            echo "=== commerce-api: últimas 150 líneas ==="
            docker compose -f compose.prod.yaml --env-file .env.prod logs --tail 150 commerce-api
            echo ""
            echo "=== agent-v2: últimas 150 líneas ==="
            docker compose -f compose.prod.yaml --env-file .env.prod logs --tail 150 agent-v2
            echo ""
            echo "=== commerce-worker: últimas 80 líneas ==="
            docker compose -f compose.prod.yaml --env-file .env.prod logs --tail 80 commerce-worker
