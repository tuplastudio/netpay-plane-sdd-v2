name: One-off - diagnostico commerce-api (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-diag-api.yml"
  workflow_dispatch: {}

jobs:
  diag:
    name: docker ps + logs
    runs-on: ubuntu-latest
    steps:
      - name: Diag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"
            echo "=== ps ==="
            docker ps -a --format "{{.Names}}\t{{.Status}}" | grep -E "netpay|flagsmith" || true
            echo "=== compose ps ==="
            $DC ps -a --format "{{.Service}}\t{{.Status}}" 2>&1 || true
            echo "=== logs commerce-api (60) ==="
            $DC logs --tail 60 commerce-api 2>&1 | grep -vE "GET /api/v1/healthz" | tail -60 || true
            echo "=== healthz publico ==="
            curl -s -o /dev/null -w "%{http_code}\n" https://api-easysell.tupla.dev/api/v1/healthz || true
            echo "=== memoria ==="
            free -h
