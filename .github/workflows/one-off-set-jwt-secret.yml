name: One-off - provisionar JWT_SECRET en .env.prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-set-jwt-secret.yml"
  workflow_dispatch: {}

jobs:
  set-secret:
    name: Agregar JWT_SECRET si falta (idempotente, no imprime el valor)
    runs-on: ubuntu-latest
    steps:
      - name: Set JWT_SECRET
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/netpay/infra/.env.prod
            if grep -q '^JWT_SECRET=' "$ENV_FILE"; then
              echo "JWT_SECRET ya existe en $ENV_FILE, no se toca."
            else
              SECRET=$(openssl rand -hex 32)
              printf '\n# Access token JWT (HS256), agregado %s\nJWT_SECRET=%s\n' "$(date -u +%FT%TZ)" "$SECRET" >> "$ENV_FILE"
              echo "JWT_SECRET agregado a $ENV_FILE (64 hex chars)."
            fi
            echo "Verificando (sin mostrar valor):"
            grep -c '^JWT_SECRET=' "$ENV_FILE"
