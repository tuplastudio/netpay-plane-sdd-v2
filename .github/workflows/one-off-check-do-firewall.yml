name: One-off - firewall DigitalOcean (API, solo lectura)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-check-do-firewall.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: solo lectura via API DO
    runs-on: ubuntu-latest
    steps:
      - name: consultar droplet y firewalls
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "--- droplet con IP 165.227.200.148 ---"
          DROPLET_JSON=$(curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/droplets?per_page=200")
          echo "$DROPLET_JSON" | jq -r '.droplets[] | select(.networks.v4[]?.ip_address=="165.227.200.148") | "id=\(.id) name=\(.name) status=\(.status)"'
          DROPLET_ID=$(echo "$DROPLET_JSON" | jq -r '.droplets[] | select(.networks.v4[]?.ip_address=="165.227.200.148") | .id' | head -1)
          echo "DROPLET_ID=$DROPLET_ID"

          echo "--- firewalls de la cuenta ---"
          FW_JSON=$(curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/firewalls?per_page=200")
          echo "$FW_JSON" | jq -r '.firewalls[] | "name=\(.name) id=\(.id) status=\(.status) droplet_ids=\(.droplet_ids)"'

          echo "--- firewall(s) que incluyen este droplet ---"
          echo "$FW_JSON" | jq --argjson did "$DROPLET_ID" '.firewalls[] | select(.droplet_ids[]? == $did)'

          echo "--- rate limit / permisos del token ---"
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/account"

          echo "--- estado de la cuenta (locked/warning/active) ---"
          curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/account" | jq '.account | {status, email_verified, droplet_limit}'

          echo "--- detalle droplet (locked, features, vpc) ---"
          curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/droplets/$DROPLET_ID" | jq '.droplet | {id, name, status, locked, features, vpc_uuid}'

          echo "--- load balancers de la cuenta ---"
          curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/load_balancers" | jq -r '.load_balancers[]? | "name=\(.name) id=\(.id) status=\(.status) droplet_ids=\(.droplet_ids)"'

          echo "--- ips flotantes/reservadas ---"
          curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/reserved_ips" | jq -r '.reserved_ips[]? | "ip=\(.ip) droplet_id=\(.droplet.id // "sin asignar")"'

          echo "--- eventos/acciones recientes del droplet ---"
          curl -s -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/droplets/$DROPLET_ID/actions?per_page=10" | jq -r '.actions[]? | "\(.started_at) \(.type) status=\(.status)"'

          echo "--- curl externo real desde el runner de GitHub Actions (red distinta) ---"
          curl -sk -m 10 -o /dev/null -w 'api-easysell: HTTP %{http_code} (%{time_total}s)\n' https://api-easysell.tupla.dev/api/v1/healthz || echo "api-easysell: fallo/reset desde runner GH"
          curl -sk -m 10 -o /dev/null -w 'captain: HTTP %{http_code} (%{time_total}s)\n' https://captain.cx.tupla.dev/ || echo "captain: fallo/reset desde runner GH"
          curl -s -m 10 -o /dev/null -w 'ping tcp 443 via curl http: %{http_code}\n' http://165.227.200.148/ -H 'Host: api-easysell.tupla.dev' || echo "fallo via IP directa"
