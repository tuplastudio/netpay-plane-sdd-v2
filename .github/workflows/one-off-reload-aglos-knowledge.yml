name: One-off - recargar conocimiento del bot de Pinturas Aglos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-reload-aglos-knowledge.yml"

jobs:
  reload:
    name: Localizar tenant Aglos y subir negocio.md + preguntas-frecuentes.md
    runs-on: ubuntu-latest
    steps:
      - name: Reload
        uses: appleboy/ssh-action@v1
        env:
          NEGOCIO_B64: ""
          FAQ_B64: ""
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          envs: NEGOCIO_B64,FAQ_B64
          script: |
            set -uo pipefail
            cd /opt/netpay-build/infra
            DC="docker compose -f compose.prod.yaml --env-file .env.prod"

            echo "=== localizar tenant Aglos ==="
            TENANT_ID=$($DC exec -T -w /repo/apps/commerce-api commerce-api node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const t = await p.tenant.findFirst({ where: { name: { contains: 'aglos', mode: 'insensitive' } } });
              if (!t) { console.error('NOT_FOUND'); process.exit(1); }
              console.log(t.id);
              await p.\$disconnect();
            })().catch((e) => { console.error('ERR', e.message); process.exit(1); });
            " | tail -1)
            echo "tenant_id=$TENANT_ID"
            if [ -z "$TENANT_ID" ]; then echo "no se encontro tenant Aglos"; exit 1; fi

            echo "=== conocimiento actual (antes) ==="
            $DC exec -T agent-v2 python -c "
            import os, httpx
            r = httpx.get('http://localhost:8010/knowledge', params={'tenantId': '$TENANT_ID'}, headers={'X-Internal-Key': os.environ['AGENT_INTERNAL_KEY']}, timeout=30)
            print(r.status_code, r.text[:800])
            "

            echo "=== subir negocio.md y preguntas-frecuentes.md ==="
            $DC exec -T -e NEGOCIO_B64="$NEGOCIO_B64" -e FAQ_B64="$FAQ_B64" -e TENANT_ID="$TENANT_ID" agent-v2 python -c "
            import base64, os, httpx
            key = os.environ['AGENT_INTERNAL_KEY']
            tenant = os.environ['TENANT_ID']
            docs = {
                'negocio.md': base64.b64decode(os.environ['NEGOCIO_B64']),
                'preguntas-frecuentes.md': base64.b64decode(os.environ['FAQ_B64']),
            }
            for name, content in docs.items():
                r = httpx.post(
                    'http://localhost:8010/knowledge/upload',
                    params={'tenantId': tenant},
                    headers={'X-Internal-Key': key},
                    files={'file': (name, content, 'text/markdown')},
                    timeout=30,
                )
                print(name, r.status_code, r.text[:300])
            "

            echo "=== conocimiento actual (despues) ==="
            $DC exec -T agent-v2 python -c "
            import os, httpx
            r = httpx.get('http://localhost:8010/knowledge', params={'tenantId': '$TENANT_ID'}, headers={'X-Internal-Key': os.environ['AGENT_INTERNAL_KEY']}, timeout=30)
            print(r.status_code, r.text[:1500])
            "
