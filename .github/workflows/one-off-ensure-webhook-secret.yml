name: One-off - asegurar DUMMY_WEBHOOK_SECRET_REF en .env.prod

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-ensure-webhook-secret.yml"

jobs:
  ensure:
    name: Revisar llaves (solo nombres) y generar el secreto si falta
    runs-on: ubuntu-latest
    steps:
      - name: Ensure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra

            echo "=== llaves presentes (solo nombres, sin valores) ==="
            for k in DUMMY_WEBHOOK_SECRET_REF DUMMY_WEBHOOK_SECRET APP_ENV NODE_ENV SESSION_SECRET_REF TOKEN_ENCRYPTION_KEY_REF AGENT_SECRET_KEY AGENT_INTERNAL_KEY; do
              if grep -qE "^${k}=.+" .env.prod; then echo "$k: SI"; else echo "$k: NO"; fi
            done

            if grep -qE "^(DUMMY_WEBHOOK_SECRET_REF|DUMMY_WEBHOOK_SECRET)=.+" .env.prod; then
              echo "secreto de webhook ya configurado; no se toca"
            else
              SECRET=$(openssl rand -hex 32)
              printf '\nDUMMY_WEBHOOK_SECRET_REF=%s\n' "$SECRET" >> .env.prod
              echo "DUMMY_WEBHOOK_SECRET_REF generado en el server (no sale de aqui)"
            fi
