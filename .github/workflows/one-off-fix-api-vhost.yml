name: One-off - restaurar vhost api-easysell en captain-nginx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-fix-api-vhost.yml"

jobs:
  fix:
    name: Diagnóstico + restauración del vhost TLS del API
    runs-on: ubuntu-latest
    steps:
      - name: Restore vhost
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            DOMAIN=api-easysell.tupla.dev
            CONF_DIR=/captain/generated/nginx/conf.d
            VHOST_FILE="$CONF_DIR/api-easysell.conf"
            LIVE="/captain/data/letencrypt/etc/live/$DOMAIN"
            CFG="/captain/data/letencrypt/etc/config/live/$DOMAIN"
            NGX=$(docker ps --format '{{.Names}}' | grep captain-nginx | head -1)
            echo "captain-nginx container: ${NGX:-NO ENCONTRADO}"
            test -n "$NGX" || exit 2

            echo "=== conf.d actual ==="
            sudo ls -la "$CONF_DIR"
            echo "=== ¿vhost presente? ==="
            sudo grep -l "$DOMAIN" "$CONF_DIR"/*.conf 2>/dev/null || echo "vhost $DOMAIN NO está en ningún .conf"
            echo "=== certs ==="
            sudo ls -la "$LIVE" 2>/dev/null || echo "sin dir $LIVE"
            sudo ls -la "$CFG" 2>/dev/null || echo "sin dir $CFG"
            if sudo test -f "$LIVE/fullchain.pem"; then
              sudo openssl x509 -noout -subject -enddate -in "$LIVE/fullchain.pem"
            fi
            echo "=== redes de captain-nginx ==="
            docker inspect "$NGX" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'; echo
            echo "=== commerce-api publicado en 14000 desde el host ==="
            curl -sS -m 5 http://127.0.0.1:14000/api/v1/healthz; echo

            # ---- certificados: si faltan en el path de captain, copiarlos del de certbot ----
            if ! sudo test -f "$LIVE/fullchain.pem"; then
              if sudo test -f "$CFG/fullchain.pem"; then
                echo ">> copiando certs de certbot a $LIVE"
                sudo mkdir -p "$LIVE"
                sudo cp -L "$CFG"/*.pem "$LIVE"/
              else
                echo "!! NO HAY CERTIFICADO en ningún path. Falta correr certbot (paso 1 de infra/caprover-api-easysell.md)."
                exit 3
              fi
            fi

            # ---- vhost: archivo propio en conf.d (captain.conf lo regenera CapRover y borra ediciones manuales) ----
            if sudo grep -q "$DOMAIN" "$CONF_DIR"/*.conf 2>/dev/null; then
              echo ">> el vhost ya existe en conf.d; no se reescribe"
            else
              echo ">> escribiendo $VHOST_FILE"
              sudo tee "$VHOST_FILE" >/dev/null <<'NGINX'
            # Vhost del API del proyecto (commerce-api). Archivo propio, NO dentro
            # de captain.conf: CapRover regenera captain.conf y borra lo manual.
            # Upstream al puerto publicado del compose (0.0.0.0:14000) para no
            # depender de `docker network connect` (se pierde al recrear nginx).
            server {
                listen 80;
                listen 443 ssl;
                http2 on;
                server_name api-easysell.tupla.dev;
                client_max_body_size 500m;
                ssl_certificate     /letencrypt/etc/live/api-easysell.tupla.dev/fullchain.pem;
                ssl_certificate_key /letencrypt/etc/live/api-easysell.tupla.dev/privkey.pem;

                location /.well-known/acme-challenge/ {
                    alias /usr/share/nginx/domains/api-easysell.tupla.dev/.well-known/acme-challenge/;
                }

                location / {
                    proxy_pass http://165.227.200.148:14000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 120s;
                }
            }
            NGINX
              sudo mkdir -p "/captain/generated/static/domains/$DOMAIN/.well-known/acme-challenge"
            fi

            echo "=== nginx -t ==="
            if docker exec "$NGX" nginx -t; then
              docker kill -s HUP "$NGX"
              echo ">> nginx recargado"
            else
              echo "!! nginx -t falló; retiro $VHOST_FILE para no dejar nginx roto"
              sudo rm -f "$VHOST_FILE"
              docker exec "$NGX" nginx -t || true
              exit 4
            fi

            sleep 3
            echo "=== verificación HTTPS desde el droplet ==="
            curl -sS -m 10 -o /dev/null -w "https healthz http=%{http_code} ssl_verify=%{ssl_verify_result}\n" "https://$DOMAIN/api/v1/healthz"
            curl -sS -m 10 "https://$DOMAIN/api/v1/healthz"; echo
            echo "=== vencimiento del cert servido ==="
            echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate
