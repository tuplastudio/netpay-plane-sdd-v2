name: One-off - migración 0013 + diagnóstico WhatsApp en Neon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-migrate-0013.yml"

jobs:
  migrate:
    name: Aplicar 0013_order_tracking_token.sql y leer estado de WhatsApp
    runs-on: ubuntu-latest
    steps:
      # Se ejecuta DENTRO del contenedor de commerce-api: ahí ya está el
      # DATABASE_URL real (env_file) y @prisma/client; no hace falta psql ni
      # sacar el connection string al host.
      - name: Run migration + read-only diagnostics (inside commerce-api)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd /opt/netpay-build/infra
            echo "=== DATABASE_URL presente en el contenedor? ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T commerce-api sh -c 'test -n "$DATABASE_URL" && echo "sí (host: $(echo "$DATABASE_URL" | sed -E "s#.*@([^/:?]+).*#\1#"))" || echo NO'
            echo "=== migración 0013 + diagnóstico ==="
            docker compose -f compose.prod.yaml --env-file .env.prod exec -T -w /repo/apps/commerce-api commerce-api node - <<'JS'
            const fs = require("fs");
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            (async () => {
              const sql = fs.readFileSync("/repo/apps/commerce-api/prisma/migrations/0013_order_tracking_token.sql", "utf8");
              const statements = sql
                .split("\n").filter((l) => !l.trim().startsWith("--")).join("\n")
                .split(";").map((s) => s.trim()).filter(Boolean);
              for (const st of statements) {
                try {
                  await prisma.$executeRawUnsafe(st);
                  console.log("OK:", st.split("\n")[0].slice(0, 90));
                } catch (e) {
                  const msg = String(e && e.message || e);
                  if (/already exists|ya existe/i.test(msg)) { console.log("YA EXISTÍA:", st.split("\n")[0].slice(0, 90)); continue; }
                  throw e;
                }
              }
              const rows = await prisma.$queryRawUnsafe('select count(*)::int as filas from "OrderTrackingToken"');
              console.log("OrderTrackingToken filas:", JSON.stringify(rows));

              console.log("=== WhatsApp: conexiones (sin secretos ni teléfonos) ===");
              const conns = await prisma.$queryRawUnsafe(
                'select "status","provider",split_part("webhookUrl",\'?\',1) as webhook_base,left(coalesce("lastError",\'\'),120) as last_error,"updatedAt" from "WhatsAppConnection" order by "updatedAt" desc limit 5'
              );
              console.log(JSON.stringify(conns, null, 1));

              console.log("=== WhatsApp: mensajes por hora y dirección (últimos 3 días) ===");
              const byHour = await prisma.$queryRawUnsafe(
                'select to_char(date_trunc(\'hour\',"createdAt"),\'YYYY-MM-DD HH24:00\') as hora,"direction"::text as dir,count(*)::int as n from "WhatsAppMessage" where "createdAt" > now() - interval \'3 days\' group by 1,2 order by 1 desc,2 limit 40'
              );
              console.log(JSON.stringify(byHour, null, 1));

              console.log("=== WhatsApp: último mensaje ===");
              const last = await prisma.$queryRawUnsafe('select max("createdAt") as ultimo, count(*)::int as total from "WhatsAppMessage"');
              console.log(JSON.stringify(last));
              await prisma.$disconnect();
            })().catch((e) => { console.error("ERROR:", e && e.message || e); process.exit(1); });
            JS
