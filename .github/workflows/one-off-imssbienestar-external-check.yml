name: One-off - check externo imssbienestar.tupla.dev (sin SSH)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-imssbienestar-external-check.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: curl real desde el runner de GitHub (internet real, no el droplet)
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          set -x
          echo "=== DNS ==="
          getent hosts imssbienestar.tupla.dev || true
          getent hosts api-easysell.tupla.dev || true
          echo ""
          echo "=== control: api-easysell (sabemos que funciona en prod) ==="
          curl -sk -m 10 -o /dev/null -w "api-easysell https: %{http_code}\n" https://api-easysell.tupla.dev/api/v1/healthz || true
          echo ""
          echo "=== imssbienestar ==="
          curl -sk -m 10 -v https://imssbienestar.tupla.dev/ 2>&1 | tail -40
          echo ""
          curl -s -m 10 -o /dev/null -w "imssbienestar http: %{http_code}\n" http://imssbienestar.tupla.dev/ || true
